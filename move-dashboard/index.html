<!DOCTYPE html>
<html lang = "ko">
<head>
<meta charset="UTF-8">
<title> Movie Data Dashboard </title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>🎬 영화 데이터 분석 대시보드</h1>
   <button id="darkModeToggle">🌙 다크모드</button>
    <p id="movieCount"></p>

<div class="controls">

<label>장르</label>
<select id="genreFilter">
<option value="ALL">전체</option>
<option value="Action">Action</option>
<option value="Drama">Drama</option>
<option value="SF">SF</option>
<option value="Romance">Romance</option>
<option value="Animation">Animation</option>
</select>

<label>검색</label>
<input type="text" id="searchInput" placeholder="영화 제목 검색">

<label>평점</label>
<input type="range" id="ratingFilter" min="6" max="10" step="0.1" value="6">
<span id="ratingValue">6</span>

</div>

<div class="container">

<div class="chart-box">
<h2>장르별 영화 수</h2>
<canvas id="genreChart"></canvas>
</div>

<div class="chart-box">
<h2>연도별 영화 개수</h2>
<canvas id="yearChart"></canvas>
</div>

</div>

<div class="top-movies">
<h2>⭐ 평점 TOP10 영화</h2>
<ul id="topMovies"></ul>
</div>

<script src="script.js"></script>

</body>
</html>
